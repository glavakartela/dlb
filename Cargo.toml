[package]
name = "dlb"
version = "0.4.0"
edition = "2021"
description = "DLB: context-mixing file compressor with its own .dlb format"

[lib]
name = "dlbcore"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dlb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
