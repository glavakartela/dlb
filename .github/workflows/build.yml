name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo install cross --locked
      - run: cross test --release --target ${{ matrix.target }}
      - run: cross build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dlb-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dlb

  # Static musl binaries above also run on Android via adb shell / Termux.
  # These are the bionic builds, built with the NDK preinstalled on ubuntu runners.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o out build --release
      - uses: actions/upload-artifact@v4
        with: { name: dlb-android, path: out }

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dlb-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dlb.exe

  # ---- Flutter app (needs app/dlb_app/scripts/setup.sh to generate runner folders) ----
  app-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash app/dlb_app/scripts/setup.sh
      - run: bash app/dlb_app/scripts/build_native.sh android
      - run: flutter build apk --release --split-per-abi
        working-directory: app/dlb_app
      - uses: actions/upload-artifact@v4
        with: { name: dlb-app-android, path: "app/dlb_app/build/app/outputs/flutter-apk/*.apk" }

  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash app/dlb_app/scripts/setup.sh
      - run: flutter build linux --release
        working-directory: app/dlb_app
      - run: bash app/dlb_app/scripts/build_native.sh linux
      - uses: actions/upload-artifact@v4
        with: { name: dlb-app-linux-x64, path: app/dlb_app/build/linux/x64/release/bundle }

  app-windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash app/dlb_app/scripts/setup.sh
      - run: flutter build windows --release
        working-directory: app/dlb_app
      - run: bash app/dlb_app/scripts/build_native.sh windows
      - uses: actions/upload-artifact@v4
        with: { name: dlb-app-windows-x64, path: app/dlb_app/build/windows/x64/runner/Release }
