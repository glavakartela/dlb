name: macOS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cli:
    name: CLI universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --release
      - run: |
          cargo build --release --target aarch64-apple-darwin --bin dlb
          cargo build --release --target x86_64-apple-darwin --bin dlb
          mkdir -p out
          lipo -create -output out/dlb \
            target/aarch64-apple-darwin/release/dlb \
            target/x86_64-apple-darwin/release/dlb
          lipo -info out/dlb
      - uses: actions/upload-artifact@v4
        with:
          name: dlb-cli-macos-universal
          path: out/dlb
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cp out/dlb dlb-macos-universal
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dlb-macos-universal

  app:
    name: Flutter app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash app/dlb_app/scripts/setup.sh
      - run: flutter analyze --no-fatal-infos
        working-directory: app/dlb_app
      - run: flutter test
        working-directory: app/dlb_app
      - run: flutter build macos --release
        working-directory: app/dlb_app
      - id: bundle
        run: |
          APPDIR="$(bash app/dlb_app/scripts/build_native.sh macos | tail -n1)"
          echo "dir=$APPDIR" >> "$GITHUB_OUTPUT"
          ditto -c -k --keepParent "$APPDIR" dlb-app-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dlb-app-macos
          path: dlb-app-macos.zip
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dlb-app-macos.zip
