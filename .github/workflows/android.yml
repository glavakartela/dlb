name: Android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: APK (arm64-v8a, armeabi-v7a, x86, x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: cargo install cargo-ndk --locked

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: bash app/dlb_app/scripts/setup.sh

      - name: Fix desktop_drop compileSdk
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" "platforms;android-36"

          DESKTOP_DROP="$HOME/.pub-cache/hosted/pub.dev/desktop_drop-0.5.0"

          if [ ! -d "$DESKTOP_DROP" ]; then
            echo "::error::desktop_drop 0.5.0 was not found at $DESKTOP_DROP"
            find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'desktop_drop-*' -print
            exit 1
          fi

          echo "Patching $DESKTOP_DROP"

          find "$DESKTOP_DROP/android" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print \
            -exec sed -i \
              -E 's/compileSdkVersion[[:space:]]+33/compileSdkVersion 36/g; s/compileSdk[[:space:]]*=[[:space:]]*33/compileSdk = 36/g' \
              {} \;

          echo "Result:"
          grep -RIn \
            -E 'compileSdk(Version)?' \
            "$DESKTOP_DROP/android" || true

      # ANDROID_NDK_HOME is preinstalled on GitHub's ubuntu runners
      - run: bash app/dlb_app/scripts/build_native.sh android

      - run: flutter build apk --release --split-per-abi
        working-directory: app/dlb_app

      - uses: actions/upload-artifact@v4
        with:
          name: dlb-app-android
          path: app/dlb_app/build/app/outputs/flutter-apk/*.apk