name: Linux

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Static musl CLI builds. These also run on Android via `adb shell` or Termux.
  cli:
    name: CLI ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross test --release --target ${{ matrix.target }}
      - run: cross build --release --target ${{ matrix.target }} --bin dlb
      - uses: actions/upload-artifact@v4
        with:
          name: dlb-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dlb

  app:
    name: Flutter app (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cargo test --release
      - run: bash app/dlb_app/scripts/setup.sh
      - run: flutter analyze --no-fatal-infos
        working-directory: app/dlb_app
      - run: flutter test
        working-directory: app/dlb_app
      - run: flutter build linux --release
        working-directory: app/dlb_app
      - run: bash app/dlb_app/scripts/build_native.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: dlb-app-linux-x64
          path: app/dlb_app/build/linux/x64/release/bundle
